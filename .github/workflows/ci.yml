name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-smoke:
    name: Python smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Ruff (advisory)
        run: ruff check --output-format=github --exit-zero .

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Fresh-clone CLI smoke
        run: |
          python run.py setup
          python run.py check
          python run.py status
          python run.py doctor
          python run.py ui --help

      - name: Run tests
        run: pytest -q
